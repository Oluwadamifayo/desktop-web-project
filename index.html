<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dynamic Web Project</title><style>body { font-family: system-ui, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; color: #333; transition: background 0.3s, color 0.3s; } .dark-mode { background-color: #1e1e2e; color: #cdd6f4; } button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 6px; background-color: #0070f3; color: white; } button:hover { background-color: #0051a8; } #clock { font-size: 2rem; font-weight: bold; margin: 20px 0; }</style></head><body><h1>Interactive & Dynamic Web Site</h1><p>Hosted on Vercel via GitHub</p><div id="clock">00:00:00</div><button onclick="toggleTheme()">Toggle Dark Mode</button><button onclick="countClick()">Clicks: <span id="click-count">0</span></button><script>function updateClock(){document.getElementById("clock").innerText=new Date().toLocaleTimeString();}setInterval(updateClock,1000);updateClock();function toggleTheme(){document.body.classList.toggle("dark-mode");}let count=0;function countClick(){count++;document.getElementById("click-count").innerText=count;}</script></body></html>
